url: https://eryktomaszek.github.io/KaskadaR/

lang: pl

template:
  bootstrap: 5
  bslib:
    primary: "#2E5E9E"
    base_font: {google: "Source Sans 3"}
    code_font: {google: "JetBrains Mono"}

home:
  title: Ocena rankingu w modelu kaskadowym
  description: >
    Pakiet języka R do oceny rankingu wyników wyszukiwania miarą Expected
    Reciprocal Rank w modelu kaskadowym, z pełnym profilem zatrzymania
    użytkownika.

navbar:
  structure:
    left:  [algorytm, poradnik, reference, news]
    right: [aplikacja, oserwisie, github]
  components:
    reference:
      text: Dokumentacja funkcji
      href: reference/index.html
    news:
      text: Zmiany
      href: news/index.html
    algorytm:
      text: Algorytm
      href: articles/algorytm.html
    poradnik:
      text: Poradnik
      href: articles/poradnik.html
    aplikacja:
      text: Aplikacja
      href: app/index.html
    oserwisie:
      text: O serwisie
      href: articles/o-serwisie.html

articles:
  - title: Metoda
    navbar: ~
    contents:
      - articles/algorytm
  - title: Użycie
    contents:
      - poradnik
  - title: Informacje
    contents:
      - articles/o-serwisie

reference:
  - title: Miara ERR
    desc: Expected Reciprocal Rank i profil zatrzymania dla jednego rankingu.
    contents:
      - oblicz_err
      - profil_zatrzymania
      - metody_wynik_err
  - title: Porównanie systemów
    desc: Miara po zapytaniach i średnie systemów.
    contents:
      - porownaj_err
      - metody_porownanie_err
  - title: Kontrola modelu
    desc: Symulacja użytkowników modelu kaskadowego.
    contents:
      - symuluj_uzytkownikow
      - metody_symulacja_err
  - title: Dane
    desc: Procedura generowania danych o znanych stopniach trafności i zbiory przykładowe.
    contents:
      - generuj_rankingi
      - oceny_przyklad
      - rankingi_przyklad
  - title: Pakiet
    contents:
      - KaskadaR-package

footer:
  structure:
    left: nota
    right: built_with
  components:
    nota: >
      Serwis stanowi integralną część pracy licencjackiej na kierunku
      elektroniczne przetwarzanie informacji, Instytut Studiów Informacyjnych UJ.
